name: 构建并发布

# 推 main 时构建 + 部署到 GitHub Pages；
# 打 tag（v*）时额外出一个 Release，把单文件版附上去，方便同学直接下载。
#
# 为什么单文件版走 Release 而不是塞进仓库：
#   dist/ 是产物，提交进仓库就会出现"源码改了但产物没跟着改"的误会。
#   Release 附件既有稳定链接，又不会污染 git 历史。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 密钥/个人信息扫描 —— 这仓库是公开的，一旦推上去历史就抹不掉。
      # 它自己走目录、不 spawn git（沙箱里 spawnSync 会 EPERM），所以在 CI 上也能跑。
      - name: 扫描凭据与个人信息
        run: node tools/check-secrets.mjs

      # 测试失败就不发布 —— 课表算错比不更新更糟
      - name: 跑测试
        run: node test/run.mjs

      - name: 构建
        run: node web/build.mjs

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

      - name: 单文件版留作 Release 附件
        uses: actions/upload-artifact@v4
        with:
          name: single-file
          path: dist/仰山课表.html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: single-file

      - uses: softprops/action-gh-release@v2
        with:
          files: 仰山课表.html
          generate_release_notes: true
